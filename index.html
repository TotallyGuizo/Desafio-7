<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva ENEM 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="cabecalho-enem">
        <h1>Foco no ENEM 2026</h1>
        <p>Acompanhe quanto tempo falta para o primeiro dia de prova!</p>
    </header>

    <main id="painel-principal">
        <!-- Área do cronômetro -->
        <section id="cronometro-container">
            <div class="bloco-tempo">
                <span id="dias">00</span>
                <p>Dias</p>
            </div>
            <div class="bloco-tempo">
                <span id="horas">00</span>
                <p>Horas</p>
            </div>
            <div class="bloco-tempo">
                <span id="minutos">00</span>
                <p>Minutos</p>
            </div>
            <div class="bloco-tempo">
                <span id="segundos">00</span>
                <p>Segundos</p>
            </div>
        </section>

        <!-- Mensagem de condição baseada no tempo restante -->
        <section id="status-estudos">
            <p id="mensagem-status">Calculando tempo restante...</p>
        </section>
    </main>

    <footer id="rodape-autor">
        <p>&copy; 2026 - Desenvolvido por [Seu Nome] | Compartilhado com a Turma</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
